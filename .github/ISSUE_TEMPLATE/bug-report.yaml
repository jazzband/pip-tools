---

name: Bug report
description: Create a report to help us improve pip-tools.

body:
  - type: textarea
    id: bug-description
    attributes:
      label: Describe the Bug
      description: >-
          A clear and concise description of what the bug is.
    validations:
      required: true

  - type: textarea
    id: expected-behaviour
    attributes:
      label: Expected Behaviour
      description: >-
          A description of what were you expecting to happen.
    validations:
          required: true

  - type: textarea
    id: reproduction-steps
    attributes:
      label: Steps to Reproduce
      description: >-
          Describe the steps to reproduce the bug. 
      placeholder: |
          1. ...
          2. ...
          3. ...
    validations:
      required: false

  - type: textarea
    id: environment
    attributes:
      label: Environment Versions
      description: >-
          Describe the environment versions used.
      placeholder: |
          1. OS Type
          2. Python version: `$ python -V`
          3. pip version: `$ pip --version`
          4. pip-tools version: `$ pip-compile --version`
    validations:
      required: false